<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Explore Growcasts, webinars e conteúdos da Growdev na Growflix."
    >

    <title>
        Growflix - Todos os vídeos da Growdev em um só lugar.
    </title>

    <!-- Bootstrap local -->
    <link
        rel="stylesheet"
        href="./assets/libs/bootstrap-5.3/css/bootstrap.min.css"
    >

    <!-- Estilos do projeto -->
    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>

<body>

    <!-- =========================
         CABEÇALHO / DESTAQUE
    ========================== -->
    <header class="cabecalho-home">

        <nav
            class="navbar navbar-expand-lg navbar-dark navegacao-home"
            aria-label="Navegação principal"
        >
            <div class="container-fluid">

                <a
                    class="navbar-brand"
                    href="./index.html"
                    aria-label="Growflix - Página inicial"
                >
                    <img
                        src="./assets/images/logo-growflix.svg"
                        alt="Logo Growflix"
                        width="120"
                        height="30"
                    >
                </a>


                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu-principal"
                    aria-controls="menu-principal"
                    aria-expanded="false"
                    aria-label="Abrir menu de navegação"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>


                <div
                    class="collapse navbar-collapse"
                    id="menu-principal"
                >
                    <div class="navbar-nav">

                        <a
                            class="nav-link active"
                            aria-current="page"
                            href="./home.html"
                        >
                            Início
                        </a>

                        <a
                            class="nav-link"
                            href="#secao-growcast"
                        >
                            Growcast [Episódios]
                        </a>

                        <a
                            class="nav-link"
                            href="#secao-webinar"
                        >
                            Webinar em Flutter
                        </a>

                        <a
                            class="nav-link"
                            href="#secao-ux-ui"
                        >
                            Jornada UX/UI
                        </a>

                        <a
                            class="nav-link"
                            href="#secao-diversos"
                        >
                            Diversos
                        </a>

                    </div>
                </div>

            </div>
        </nav>
        <section
            class="hero-home"
            aria-labelledby="titulo-growcast"
        >
            <div class="container">

                <div class="row align-items-end hero-home__conteudo">

                    <div class="col-12 col-lg-6">

                        <p class="hero-home__categoria">
                            PODCAST
                        </p>

                        <h1
                            id="titulo-growcast"
                            class="hero-home__titulo"
                        >
                            GROWCAST
                        </h1>

                        <button
                            type="button"
                            class="btn btn-light hero-home__botao"
                        >
                            ▶ Assistir
                        </button>

                    </div>

                </div>

            </div>
        </section>
    </header>


    <!-- =========================
         CATÁLOGO DE CONTEÚDOS
    ========================== -->

    <main>
        <section 
            id="secao-growcast"
            class="secao-catalogo"
            aria-labelledby="titulo-secao-growcast"
        >   
            <div class="container">
                <div class="secao-catalogo__cabecalho">
                    <h2 
                        id="titulo-secao-growcast"
                        class="secao-catalogo__titulo"
                    >  
                        Growcast [Episódios]

                    </h2>
                </div>

                <div
                    id="lista-growcast" 
                    class="row g-4">
                    <!--VÍDEOS QUE SERÃO INSERIDOS DINAMICAMENTE VIA JS-->
                </div>
            </div>

        </section>

        <section
            id="secao-webinar" 
            class="secao-catalogo"
            aria-labelledby="titulo-secao-webinar"
        >
            <div class="container">
                <div class="secao-catalogo__cabecalho">
                    <h2
                        id="titulo-secao-webinar" 
                        class="secao-catalogo__titulo"
                    >
                        Webinar em Flutter
                    </h2>
                </div>
                <div
                    id="lista-webinar" 
                    class="row g-4">
                    <!--VÍDEOS QUE SERÃO INSERIDOS DINAMICAMENTE VIA JS-->
                </div>
            </div>
        </section>
        <section
            id="secao-ux-ui"
            class="secao-catalogo"
            aria-labelledby="titulo-secao-ux-ui"
        >
            <div class="container">

                <div class="secao-catalogo__cabecalho">

                    <h2
                        id="titulo-secao-ux-ui"
                        class="secao-catalogo__titulo"
                    >
                        Jornada UX/UI
                    </h2>

                </div>

                <div
                    id="lista-ux-ui"
                    class="row g-4"
                >
                    <!-- VÍDEOS INSERIDOS DINAMICAMENTE VIA JS -->
                </div>

            </div>
        </section>

        <section
            id="secao-diversos"
            class="secao-catalogo"
            aria-labelledby="titulo-secao-diversos"
        >
            <div class="container">

                <div class="secao-catalogo__cabecalho">

                    <h2
                        id="titulo-secao-diversos"
                        class="secao-catalogo__titulo"
                    >
                        Diversos
                    </h2>

                </div>

                <div
                    id="lista-diversos"
                    class="row g-4"
                >
                    <!-- VÍDEOS INSERIDOS DINAMICAMENTE VIA JS -->
                </div>

            </div>
        </section>
    </main>


    <!-- =========================
         RODAPÉ
    ========================== -->

    <footer>

    </footer>


    <!-- Bootstrap JS local -->
    <script
        src="./assets/libs/bootstrap-5.3/js/bootstrap.bundle.min.js"
    ></script>
    <script
        src="./js/database.js"
    ></script>
    <script
        src="./js/app.js"
    ></script>

</body>

</html>

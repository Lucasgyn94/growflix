<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >
        <meta
            name="description"
            content="Growflix: Growcasts, webinars e conteúdos exclusivos da Growdev."
        >
        <title>
            Growflix - Todos os vídeos da Growdev em um só lugar.
        </title>
        <!-- Bootstrap local -->
        <link
            rel="stylesheet"
            href="./assets/libs/bootstrap-5.3/css/bootstrap.min.css"
        >
        <!-- Estilos do projeto -->
        <link
            rel="stylesheet"
            href="./css/style.css"
        >
    </head>

    <body>

        <!-- =========================
            CABEÇALHO / BANNER INICIAL
        ========================== -->
        <header class="container-fluid banner-inicial">
            <!-- Navbar -->
            <div class="row">
                <div class="col-12">

                    <nav
                        class="navbar"
                        aria-label="Navegação principal"
                    >
                        <div class="container-fluid">

                            <a
                                class="navbar-brand"
                                href="./index.html"
                                aria-label="Growflix - Página inicial"
                            >
                                <img
                                    src="./assets/images/logo-growflix.svg"
                                    alt="Logo Growflix"
                                    width="120"
                                    height="30"
                                    class="d-inline-block align-text-top"
                                >
                            </a>

                        </div>
                    </nav>

                </div>
            </div>

            <!-- Conteúdo principal do banner -->
            <div class="row">
                <div class="col-12">

                    <div class="container">
                        <div class="row px-3 py-5 p-md-5">

                            <div class="col-12 text-center pt-5">

                                <h1 class="titulo-banner text-light fw-bold">
                                    Growcasts, webinars e
                                    <br>
                                    muito mais. Sem limites.
                                </h1>

                            </div>


                            <div class="col-12 text-center pt-2">

                                <p class="text-light fs-3">
                                    Assista onde quiser
                                </p>

                            </div>


                            <div class="col-12 text-center pt-2">

                                <p class="text-light fs-5">
                                    Pronto para assistir?
                                </p>

                            </div>


                            <div class="col-12 text-center pt-2 pb-5">

                                <a
                                    href="./home.html"
                                    class="btn btn-netflix"
                                >
                                    Vamos lá!
                                </a>

                            </div>

                        </div>
                    </div>

                </div>
            </div>

        </header>




        <!-- Bootstrap JS local -->
        <script
            src="./assets/libs/bootstrap-5.3/js/bootstrap.bundle.min.js"
        ></script>

    </body>
</html>
